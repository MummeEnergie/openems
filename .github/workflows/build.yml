name: Build OpenEMS
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop
  
jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - uses: kiancross/checkstyle-annotations-action@v1

      - name: Checkstyle
        run: ./gradlew checkstyleAll --console=plain --warn

      - name: Build all Java packages
        run: ./gradlew build --console=plain --warn

      - name: Upload Java test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-results
          path: '**/TEST-*.xml'
          if-no-files-found: ignore

      - name: Resolve OpenEMS bundles
        run: ./gradlew resolve --console=plain --warn

      - name: Validate OSGi resolution
        run: git diff --exit-code -- io.openems.backend.application/BackendApp.bndrun io.openems.edge.application/EdgeApp.bndrun

      - name: Generate JaCoCo Code-coverage-report
        run: ./gradlew jacocoTestReport jacocoAggregatedReport

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: java
          token: ${{ secrets.CODECOV_TOKEN }}

  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Cache for Node.js
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.ng
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --prefer-offline --cache ~/.npm

      - name: Build OpenEMS UI
        working-directory: ui
        run: node_modules/.bin/ng build -c "openems,openems-edge-prod,prod"

      - name: Lint OpenEMS UI
        working-directory: ui
        run: npm run lint

      - name: Test OpenEMS UI
        working-directory: ui
        env:
          CHROME_BIN: /usr/bin/google-chrome-stable
        run: npm run test -- --code-coverage --no-watch --no-progress --browsers=ChromeHeadlessCI

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: ui
          directory: ./ui/
          token: ${{ secrets.CODECOV_TOKEN }}
