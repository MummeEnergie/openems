name: Build OpenEMS Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        image: [edge, ui-edge]
        include:
          - image: edge
            dockerfile: tools/docker/edge/Dockerfile
          - image: ui-edge
            dockerfile: tools/docker/ui/Dockerfile
            args: |
              VERSION=openems,openems-edge-docker
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract OpenEMS version from OpenemsConstants.java
        id: openems_version
        run: |
          CONSTANTS_FILE="io.openems.common/src/io/openems/common/OpenemsConstants.java"
          MAJOR=$(grep -oP 'VERSION_MAJOR\s*=\s*\K[0-9]+' "$CONSTANTS_FILE")
          MINOR=$(grep -oP 'VERSION_MINOR\s*=\s*\K[0-9]+' "$CONSTANTS_FILE")
          PATCH=$(grep -oP 'VERSION_PATCH\s*=\s*\K[0-9]+' "$CONSTANTS_FILE")
          OPENEMS_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${OPENEMS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openems-${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.openems_version.outputs.version }}-${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64, linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.args }}

      - name: Verify published image tags and platforms
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' |
              jq -e --arg digest "$IMAGE_DIGEST" '
                .digest == $digest and
                ([.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"])
              '
            echo "Verified $tag at $IMAGE_DIGEST (linux/amd64, linux/arm64)"
          done <<< "$IMAGE_TAGS"
